default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: .venv/bin/mypy
        language: system
        pass_filenames: false
        types: [python]
        stages: [pre-commit]

      - id: pytest-unit
        name: pytest unit (fast)
        entry: .venv/bin/pytest tests/unit -x -q
        language: system
        pass_filenames: false
        types: [python]
        stages: [pre-commit]

      - id: pytest-full
        name: pytest full suite (unit + integration)
        entry: .venv/bin/pytest -q
        language: system
        pass_filenames: false
        stages: [pre-push]
