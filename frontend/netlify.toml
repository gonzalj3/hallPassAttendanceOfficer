# Netlify build config for the teacher iPad app (frontend/).
# Set base directory to `frontend` in the Netlify UI.

[build]
  publish = "dist"
  command = "npm ci && npm run build"

[build.environment]
  NODE_VERSION = "20"

# Proxy /auth/*, /api/*, and /v1/* to the Railway backend so the
# session cookie is set on the Netlify origin (first-party). Without
# this, browsers block the cookie as third-party (Safari ITP, Chrome
# privacy sandbox) and sign-in loops back to the login screen.
#
# `force = true` makes the redirect run even when there is a matching
# static file (there shouldn't be at these paths, but defensive).
[[redirects]]
  from = "/auth/*"
  to = "https://hpao-backend-production.up.railway.app/auth/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "https://hpao-backend-production.up.railway.app/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/v1/*"
  to = "https://hpao-backend-production.up.railway.app/v1/:splat"
  status = 200
  force = true

# SPA fallback last -- catches everything else and serves index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
