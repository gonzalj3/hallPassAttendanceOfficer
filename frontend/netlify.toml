# Netlify build config for the React/Vite iPad / teacher frontend
# in /frontend. The Netlify project must have its base directory
# set to `frontend` in the UI; Netlify then reads this file from
# the base directory. Set VITE_API_URL / VITE_WS_URL in the
# project env to point at the Railway backend.

[build]
  publish = "dist"
  command = "npm ci && npm run build"

[build.environment]
  # Vite 5 needs Node 18+. Pinned to 20 LTS for predictable builds.
  NODE_VERSION = "20"

# Single-page app fallback: any path that isn't a real file in /dist
# falls through to index.html so react-router-dom handles the route
# on the client. Without this, hitting /classes directly would 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
