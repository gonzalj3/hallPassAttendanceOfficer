<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Realtime Voice Turns</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="voice-panel" aria-labelledby="app-title">
        <div class="top-row">
          <div>
            <p class="eyebrow">gpt-realtime-2</p>
            <h1 id="app-title">Attendance call</h1>
          </div>
          <div class="status-pill" id="connectionStatus">Idle</div>
        </div>

        <div class="case-strip" id="caseStrip">Loading attendance case...</div>

        <div class="stage" aria-live="polite">
          <div class="mic-ring" id="micRing">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="M12 15a4 4 0 0 0 4-4V6a4 4 0 0 0-8 0v5a4 4 0 0 0 4 4Z" />
              <path d="M19 11a7 7 0 0 1-14 0" />
              <path d="M12 18v3" />
              <path d="M8 21h8" />
            </svg>
          </div>
          <p id="turnStatus">Click Start, allow the mic, then respond as the parent.</p>
          <div class="meter" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
          </div>
        </div>

        <div class="controls">
          <button id="startButton" type="button">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="M8 5v14l11-7Z" />
            </svg>
            Start Call
          </button>
          <button id="stopButton" type="button" disabled>
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="M6 6h12v12H6z" />
            </svg>
            End Call
          </button>
        </div>

        <section class="transcript" aria-label="Conversation transcript">
          <h2>Transcript and Excuse Save Status</h2>
          <div id="transcriptLog" class="log">
            <p class="muted">Realtime events will appear here once connected.</p>
          </div>
        </section>
      </section>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
