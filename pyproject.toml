[project]
name = "hpao"
version = "0.1.0"
description = "Hall Pass Attendance Officer -- backend + monitoring agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "pgvector>=0.3",
    "openai>=1.55",
    "httpx>=0.27",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "factory-boy>=3.3",
    "freezegun>=1.5",
    "hypothesis>=6.115",
    "aiosqlite>=0.20",
    "testcontainers[postgres]>=4.8",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hpao"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers --strict-config --import-mode=importlib"
markers = [
    "integration: requires a real postgres (testcontainers + Docker)",
    "e2e: full-stack test, slowest",
]

[tool.coverage.run]
source = ["src/hpao"]
branch = true
omit = ["src/hpao/agent/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
explicit_package_bases = true
files = ["src/hpao"]

[[tool.mypy.overrides]]
module = "hpao.agent.*"
strict = false

[[tool.mypy.overrides]]
module = ["testcontainers.*", "factory.*", "freezegun.*", "pgvector.*"]
ignore_missing_imports = true
