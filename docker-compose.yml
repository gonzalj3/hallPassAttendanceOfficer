services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: hpao
      POSTGRES_PASSWORD: hpao
      POSTGRES_DB: hpao
    ports:
      - "5432:5432"
    volumes:
      - hpao_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "hpao"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  hpao_pg:
