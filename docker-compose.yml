services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: lizzie
      POSTGRES_PASSWORD: lizzie
      POSTGRES_DB: lizzie
    ports:
      - "5432:5432"
    volumes:
      - lizzie_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "lizzie"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  lizzie_pg:
