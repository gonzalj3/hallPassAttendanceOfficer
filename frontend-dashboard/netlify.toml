# Netlify build config for the principal dashboard (frontend-dashboard/).
# Set base directory to `frontend-dashboard` in the Netlify UI.

[build]
  publish = "dist"
  command = "npm ci && npm run build"

[build.environment]
  NODE_VERSION = "20"

# Proxy /auth/*, /api/*, /v1/* to the Railway backend so the session
# cookie lives on the Netlify origin (first-party). See the teacher
# frontend's netlify.toml for the longer explanation.
[[redirects]]
  from = "/auth/*"
  to = "https://hpao-backend-production.up.railway.app/auth/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "https://hpao-backend-production.up.railway.app/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/v1/*"
  to = "https://hpao-backend-production.up.railway.app/v1/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
