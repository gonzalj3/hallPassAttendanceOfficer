# Netlify build config for the principal dashboard (frontend-dashboard/).
# The Netlify site has base directory set to `frontend-dashboard` in the UI.

[build]
  publish = "dist"
  command = "npm ci && npm run build"

[build.environment]
  NODE_VERSION = "20"

# Proxy backend routes to Railway so the lizzie_session cookie is
# first-party on the Netlify origin. See the teacher app's
# netlify.toml for the longer explanation.
[[redirects]]
  from = "/auth/*"
  to = "https://hpao-backend-production.up.railway.app/auth/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "https://hpao-backend-production.up.railway.app/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/v1/*"
  to = "https://hpao-backend-production.up.railway.app/v1/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
